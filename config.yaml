# DetectCodeGPT Configuration File
# This file contains all configuration parameters for folder_lader.py and ai_detector.py

# Database Configuration
database:
  path: "functions.db"
  drop_existing: true
  repo_name: "detectcodegpt"  # Repository name to analyze
  year: 2025  # Year to analyze (null = auto-detect first available year)

# Repository Configuration (for folder_lader.py)
repository:
  path: "."  # Current directory
  name: "detectcodegpt"  # Repository name for table naming
  year: 2025  # Year for table naming (defaults to current year if not specified)
  start_year: null  # Optional: start year for processing range (null = auto-detect from git)
  end_year: null    # Optional: end year for processing range (null = auto-detect from git)
  search: null  # Search query for functions
  stats: false  # Show database statistics
  git:
    enabled: true  # Enable git repository functionality
    use_worktree: true  # Use git worktree for year-based extraction
    cleanup_worktree: true  # Automatically cleanup temporary worktrees

# Language Configuration
languages:
  enabled: ["python", "c"]  # Languages to process: python, c
  extensions:
    python: [".py"]
    c: [".c", ".h"]
  parsing:
    python:
      extract_docstrings: true
      extract_decorators: true
      extract_generators: true
    c:
      extract_comments: true  # Extract documentation comments

# Function Filtering (for ai_detector.py)
filtering:
  limit: null  # Limit number of functions to process
  function_type: null  # Filter by function type (function, method, class_method, staticmethod)
  file_pattern: null  # Filter by file path pattern

# AI Detection Configuration (for ai_detector.py)
ai_detection:
  store_scores: true  # Store calculated scores back to database
  process_all_repos: false  # Process all repositories and years in database
  show_summary: true  # Show summary results per repo/year
  summary_only: false  # Only show summaries without processing (useful for viewing existing results)

# Model Configuration (for ai_detector.py)
models:
  base_model_name: "codellama/CodeLlama-7b-hf"
  mask_filling_model_name: "Salesforce/codet5p-770m"
  device: "auto"  # Options: "cuda", "cpu", "auto" (auto-detect)
  cache_dir: "huggingface/hub"
  int8: true  # Enable int8 quantization to reduce memory usage
  half: false
  base_half: true  # Enable half precision for base model
  scoring_model_name: ""  # Additional scoring model name

# Perturbation Configuration (for ai_detector.py)
perturbation:
  pct_words_masked: 0.5
  pct_identifiers_masked: 0.75
  span_length: 2
  n_perturbation_rounds: 1
  perturb_type: "random-insert-space+newline"  # Options: random, identifier-masking, random-line-shuffle, random-insert-newline, random-insert-space, random-insert-space-newline, random-insert-space+newline
  # Note: Only 'random' and 'identifier-masking' require mask filling model (saves memory for other types)
  buffer_size: 1
  mask_top_p: 1.0
  mask_temperature: 1.0
  chunk_size: 2  # Further reduced from 4 to 2 to prevent CUDA out of memory errors
  n_perturbations: 10  # Number of perturbations per function

# Processing Configuration (for ai_detector.py)
processing:
  batch_size: 2  # Further reduced from 5 to 2 to prevent CUDA out of memory errors
  n_similarity_samples: 20
  n_samples: 5  # Number of samples for processing
  min_len: 0  # Minimum length for text processing
  max_len: 128  # Maximum length for text processing

# CPU Optimization Settings (uncomment for CPU-only systems)
# processing:
#   batch_size: 1  # Reduce for CPU
#   n_perturbations: 5  # Reduce for CPU
# perturbation:
#   chunk_size: 1  # Reduce for CPU

# Sampling Configuration (for ai_detector.py)
sampling:
  do_top_k: false  # Use top-k sampling
  do_top_p: false  # Use top-p sampling
  temperature: 1.0  # Temperature for sampling

# Dataset Configuration (for ai_detector.py)
dataset:
  name: "functions"  # Dataset name
  key: ""  # Dataset key

# Output Configuration
output:
  output_name: "test_ipynb"
  visualize: false  # Generate visualization plots
